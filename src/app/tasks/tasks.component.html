@if(isAddingNewTask){
    <app-new-task (close)="onCloseAddTask()"  [userId]="userId"/>
}
 
<section id = "tasks">
    <header>
        <h2>Tasks for {{name}}</h2>
    </header>
    <menu>
        <button (click)="onStartAddTask()">
            Add new task
        </button>
    </menu> 
    <ul>
        @for(task of selectedUsersTasks; track task.id){
            <li>
                <app-task [task]= "task"/>
            </li>
        }
    </ul>
</section>
